    <stop offset="0%" stop-color="#e0b872" stop-opacity=".34"/><stop offset="100%" stop-color="#e0b872" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="630" fill="#1c1a24"/>
  <rect width="1200" height="630" fill="url(#gg)"/>
  <g transform="translate(900,330)">
    <ellipse cx="0" cy="150" rx="200" ry="24" fill="#000" opacity=".5"/>
    <g transform="rotate(-9)"><rect x="-150" y="-90" width="104" height="124" fill="#f4ede0"/>
      <rect x="-142" y="-82" width="88" height="88" fill="#cbbfa8"/></g>
