  <text x="80" y="132" font-family="Rubik,sans-serif" font-size="20" letter-spacing="10" fill="#e0b872">ONE SHOEBOX · NINE PHOTOGRAPHS</text>
  <text x="80" y="288" font-family="Vollkorn,serif" font-size="82" fill="#f4ede0">Lift the lid and</text>
  <text x="80" y="378" font-family="Vollkorn,serif" font-style="italic" font-size="82" fill="#e0b872">it all falls out</text>
  <text x="82" y="446" font-family="Rubik,sans-serif" font-size="23" fill="#9b93a6">Drag them around. Turn them over. Read the backs.</text>
  <text x="82" y="486" font-family="Rubik,sans-serif" font-size="23" fill="#9b93a6">Top of the wardrobe, at the back, for eleven years.</text>
