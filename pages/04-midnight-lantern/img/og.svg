<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Midnight Lantern">
  <defs><radialGradient id="lg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#fff4dc"/><stop offset="45%" stop-color="#f2a33c"/><stop offset="100%" stop-color="#8c2f2a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#05060a"/>
  <circle cx="900" cy="300" r="300" fill="url(#lg)" opacity=".45"/>
  <g transform="translate(900,290)">
    <rect x="-3" y="-150" width="6" height="34" fill="#6a4a26"/>
    <rect x="-30" y="-118" width="60" height="14" rx="3" fill="#6a4a26"/>
    <ellipse cx="0" cy="-20" rx="78" ry="94" fill="#f2a33c"/>
    <ellipse cx="0" cy="-28" rx="52" ry="64" fill="#fff4dc" opacity=".65"/>
    <rect x="-24" y="76" width="48" height="14" rx="3" fill="#6a4a26"/>
    <path d="M0 90v46" stroke="#8c2f2a" stroke-width="5"/>
  </g>
  <text x="80" y="150" font-family="Manrope,sans-serif" font-size="20" letter-spacing="10" fill="#7b8296">子夜 MIDNIGHT · OPEN 00:00–04:00</text>
  <line x1="80" y1="176" x2="330" y2="176" stroke="#f2a33c" stroke-width="1.5"/>
  <text x="80" y="300" font-family="Marcellus,serif" font-size="92" fill="#f4ead8">Carry the light</text>
  <text x="80" y="392" font-family="Marcellus,serif" font-size="92" fill="#f2a33c">through the dark</text>
  <text x="82" y="470" font-family="Manrope,sans-serif" font-size="23" fill="#7b8296">The whole shop is unlit until somebody walks it.</text>
