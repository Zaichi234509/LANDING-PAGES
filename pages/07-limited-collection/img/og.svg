  </defs>
  <rect width="1200" height="630" fill="#0c0c0c"/>
  <ellipse cx="600" cy="315" rx="520" ry="300" fill="url(#glow)"/>
  <text x="70" y="80" font-family="Italiana,serif" font-size="30" fill="#e8e6e1" letter-spacing="6">MAISON 77</text>
  <line x1="70" y1="104" x2="1130" y2="104" stroke="#e8e6e1" stroke-opacity="0.16"/>
  <text x="70" y="170" font-family="Archivo,sans-serif" font-size="17" fill="#8c8880" letter-spacing="9">SEASON IX · SEVENTY-SEVEN NUMBERED PIECES</text>
