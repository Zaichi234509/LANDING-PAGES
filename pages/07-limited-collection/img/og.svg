<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Maison 77 — Limited Collection">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6e1a26" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0c0c0c" stop-opacity="0"/>
